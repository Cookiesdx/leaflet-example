<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Fullscreen Leaflet Map</title>

	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@2.0.0-alpha.1/dist/leaflet.css" crossorigin=""/>
	<script type="importmap">
	{
		"imports": {
			"leaflet": "https://cdn.jsdelivr.net/npm/leaflet@2.0.0-alpha.1/dist/leaflet.js"
		}
	}
	</script>

	<style>
		body {
			margin: 0;
		}
		html, body, #map {
			height: 100%;
		}
	</style>
</head>
<body>

	<div id="map"></div>

	<script type="module">
		import {LeafletMap, TileLayer, Marker} from 'leaflet';

		const map = new LeafletMap('map').setView([21.0246, 105.8540], 13);

		new TileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
			maxZoom: 19,
			attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
		}).addTo(map);
/*

			.bindPopup('Hello from a fullscreen map!')
			.openPopup();*/

];

locations.forEach(([name, lat, lon]) => {
    const marker = new Marker([lat, lon])
        .addTo(map)
        .bindPopup(name)
    marker.on("click", () => {
            map.flyTo([lat, lon], 16, {
                animate: true,
                duration: 1
            });
            marker.openPopup();
        });

});


const geoJsonLayer = new geoJSON(null, {
    style: {
        color: "#088",
        opacity: 0.8,
        fillColor: "#088",
        fillOpacity: 0.3,
        weight: 2
    },
    onEachFeature: function (feature, layer) {
        const name = feature.properties?.name;
        if (name) {
            layer.bindPopup(name);
        }
    }
}).addTo(map);

// Load GeoJSON using fetch()
fetch("./poly.geojson")
    .then(response => {
        if (!response.ok) {
            throw new Error(`HTTP error: ${response.status}`);
        }
        return response.json();
    })
    .then(data => {
        // Remove previously loaded features
        geoJsonLayer.clearLayers();

        // Add Polygon, MultiPolygon, or FeatureCollection
        geoJsonLayer.addData(data);

        // Zoom to all loaded geometries
        const bounds = geoJsonLayer.getBounds();
        if (bounds.isValid()) {
            map.fitBounds(bounds, { padding: [20, 20] });
        }
    })
    .catch(error => {
        console.error("Error loading GeoJSON:", error);
    });

	</script>

</body>
</html>
